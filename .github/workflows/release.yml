name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build executable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset-name: xray-check-macos
          - os: windows-latest
            asset-name: xray-check-win
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked build dependencies
        run: uv sync --locked --no-dev --group build

      - name: Build executable
        run: uv run --no-sync python -m PyInstaller --clean --noconfirm --onefile --console --name "${{ matrix.asset-name }}" xray_sub_checker/cli.py

      - name: Smoke-test executable (macOS)
        if: runner.os == 'macOS'
        run: ./dist/xray-check-macos --help

      - name: Smoke-test executable (Windows)
        if: runner.os == 'Windows'
        run: .\dist\xray-check-win.exe --help

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: xray-check-${{ runner.os }}
          path: dist/xray-check*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          pattern: xray-check-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: xray-check ${{ github.ref_name }}
          body: |
            ## xray-check ${{ github.ref_name }}

            Download the standalone executable for your operating system:

            | File | Platform |
            | --- | --- |
            | `xray-check-macos` | macOS (GitHub runner architecture) |
            | `xray-check-win.exe` | Windows |

            `xray-check` reads Xray/V2Ray subscriptions and looks up the approximate IP, location, ISP, and ASN for each extracted server address. It does not connect to or test proxy servers.

            ### macOS

            Download `xray-check-macos`, then run:

            ```sh
            chmod +x ./xray-check-macos
            ./xray-check-macos
            ```

            The executable is unsigned and may trigger a Gatekeeper warning.

            ### Windows

            Download and run `xray-check-win.exe`. Windows SmartScreen may show a warning because the executable is unsigned.

            For options and examples, see the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md).
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
